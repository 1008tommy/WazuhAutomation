- id: fdb00a3e-65aa-42b4-be44-75a8d0440596
  name: Run downloaded lab script
  description: Windows BAS lab ability for File Delivery and Execution Lab
  tactic: execution
  technique:
    attack_id: T1059.001
    name: 'Command and Scripting Interpreter: PowerShell'
  platforms:
    windows:
      psh:
        command: '$script=''#{host.file.downloaded}''; if (-not (Test-Path -LiteralPath
          $script -PathType Leaf)) { throw ''Downloaded script is missing'' }; & $script;
          $marker=''C:\BASLab\delivery-test\executed.marker''; if (-not (Test-Path
          -LiteralPath $marker -PathType Leaf)) { throw ''Execution marker is missing''
          }; if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne ''LAB_EXECUTED'')
          { throw ''Unexpected marker content'' }; Write-Output ''Downloaded script
          execution verified''

          '
        timeout: 60
