- id: 0ae51c4e-c546-469d-bdf9-0ace34556391
  name: Create BAS lab staging directory
  description: Windows BAS lab ability for Thief-Lab
  tactic: collection
  technique:
    attack_id: T1074.001
    name: 'Data Staged: Local Data Staging'
  platforms:
    windows:
      psh:
        command: '$p = ''C:\BASLab\staged''; if (Test-Path -LiteralPath $p) { throw
          ''BAS staging directory already exists'' }; (New-Item -ItemType Directory
          -Path $p -ErrorAction Stop).FullName

          '
        timeout: 60
        cleanup: $dir='C:\BASLab\staged'; $archive='C:\BASLab\staged.zip'; if (Test-Path
          -LiteralPath $dir -PathType Container) { $items=@(Get-ChildItem -LiteralPath
          $dir -Force -ErrorAction Stop); if ($items.Count -gt 1 -or ($items.Count
          -eq 1 -and $items[0].PSIsContainer)) { throw 'Unexpected items in BAS staging
          directory' }; if ($items.Count -eq 1) { Remove-Item -LiteralPath $items[0].FullName
          -Force -ErrorAction Stop }; [System.IO.Directory]::Delete($dir) }; if (Test-Path
          -LiteralPath $archive -PathType Leaf) { Remove-Item -LiteralPath $archive
          -Force -ErrorAction Stop }
        parsers:
          plugins.stockpile.app.parsers.basic:
          - source: host.dir.staged
